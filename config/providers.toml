# Non-secret defaults. Environment variables with the same uppercase names win.
embedding_provider = "ollama"
embedding_model = "embeddinggemma:300m"
llm_provider = "ollama"
llm_model = "qwen3.5:4b"
llm_context_tokens = 8192
llm_max_output_tokens = 1800
llm_timeout_seconds = 180
# Ollama 0.40.6 MLX backend returns HTTP 501 for native format/json-schema.
# Prompt for JSON, then validate it locally; never accept unchecked output.
llm_json_mode = "prompt"
ollama_base_url = "http://127.0.0.1:11434"

# Provider labels; hosted memory is disabled in config/memory.toml.
public_data_provider = "tavily"
memory_provider = "disabled"
vector_store = "pinecone"
pinecone_index = "incident-rca"
pinecone_namespace = "historical-incidents"
# Dimension is intentionally absent: measure it from actual embeddings first.
